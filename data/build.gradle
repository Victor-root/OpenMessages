apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    compileSdk 34

    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }

    defaultConfig {
        minSdk 23
        targetSdkVersion 33
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    namespace 'io.openmessages.data'
    // For BuildConfig.DEBUG, which keeps the diagnostic
    // logging in this module out of release builds.
    buildFeatures {
        buildConfig true
    }
}

dependencies {

    // androidx
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.androidx.exifinterface
    implementation libs.androidx.documentfile

    // glide
    implementation libs.glide
    kapt libs.glide.compiler

    // dagger
    implementation libs.dagger
    implementation libs.dagger.android.support
    kapt libs.dagger.android.processor
    kapt libs.dagger.compiler
    //Resolve jdk8+ Generation Annotations - javax annotation does not exist
    implementation libs.jdk9.deps
    implementation libs.javax.annotation.api

    // rxjava
    implementation libs.rxandroid
    implementation libs.rxjava
    implementation libs.rxkotlin

    // testing
    androidTestImplementation(libs.androidx.test.espresso.core) {
        exclude group: "com.android.support", module: "support-annotations"
    }
    androidTestImplementation libs.mockito.android
    testImplementation libs.androidx.test.runner
    testImplementation libs.junit
    testImplementation libs.mockito.core

    // coroutines
    implementation libs.coroutines.core
    implementation libs.coroutines.rx2
    implementation libs.coroutines.reactive

    implementation libs.callcontrol.datashare
    implementation libs.rx.preferences
    implementation libs.timber
    implementation libs.moshi
    kapt libs.moshi.kotlin.codegen
    implementation libs.okhttp3
    implementation libs.libphonenumber
    implementation libs.kotlin.stdlib

    // work manager
    implementation libs.androidx.work.runtime.ktx
    implementation libs.androidx.work.rxjava2

    implementation project(":android-smsmms")
    implementation project(':common')
    implementation project(':domain')

}
