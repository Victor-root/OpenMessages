// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath libs.android.gradle.plugin
        classpath libs.kotlin.gradle.plugin
        classpath libs.realm.gradle.plugin
    }
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}

subprojects {
    afterEvaluate {
        if (project.hasProperty('kapt')) {
            kapt {
                // we expect this closure to run over a org.jetbrains.kotlin.gradle.plugin.KaptExtension
                javacOptions {
                    option("-source", "8")
                    option("-target", "8")
                }
            }
        }

        // Skip the release "lintVital" check across all Android modules. AGP 8.2's lint analyzer
        // crashes during setup on some JDK/JBR versions (NoClassDefFoundError: UastFacade /
        // "Already disposed: MessageBus"), which would otherwise break assembleRelease even though
        // there is no real lint problem. Lint can still be run on demand with the lint* tasks.
        if (project.extensions.findByName('android') != null) {
            project.android.lint.checkReleaseBuilds = false
        }
    }
}
